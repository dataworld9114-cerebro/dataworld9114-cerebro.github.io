<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SITE_TITLE}}</title>
<style>
  :root{
    --navy:#1F4E78; --navy-dark:#163a5a; --line:#d6dee6;
    --bg:#eef2f6; --panel:#ffffff; --text:#22303c; --muted:#5b6b7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
       display:flex;flex-direction:column}

  header{background:var(--navy);color:#fff;padding:10px 16px 0;flex:0 0 auto}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:8px}
  .brand{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .rel{font-size:12px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:99px}
  .spacer{flex:1}
  .top label{font-size:12px;color:#cfe0ee}
  select{font:inherit;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #4a7ba6;
         background:#fff;color:var(--text)}
  .linkbtn{font-size:12px;color:#cfe0ee;text-decoration:none;border:1px solid #4a7ba6;
           padding:4px 9px;border-radius:6px}
  .linkbtn:hover{background:rgba(255,255,255,.12);color:#fff}

  nav{display:flex;gap:4px;overflow-x:auto}
  .group-tabs{margin-top:1px}
  .group-tab{appearance:none;border:0;cursor:pointer;white-space:nowrap;
       background:rgba(255,255,255,.12);color:#dce8f2;
       font:inherit;font-size:14px;font-weight:700;
       padding:10px 20px;border-radius:8px 8px 0 0;border-bottom:3px solid transparent}
  .group-tab:hover{background:rgba(255,255,255,.22);color:#fff}
  .group-tab[aria-selected="true"]{background:#eef3f7;color:var(--navy);border-bottom-color:#ffc65c}
  .subnav{flex:0 0 auto;background:#eef3f7;border-bottom:1px solid var(--line);padding:7px 16px 0}
  .tab{appearance:none;border:0;cursor:pointer;white-space:nowrap;
       background:#dce5ed;color:#36566f;
       font:inherit;font-size:13px;font-weight:600;
       padding:9px 16px;border-radius:8px 8px 0 0;border-bottom:3px solid transparent}
  .tab:hover{background:#cddbe6;color:var(--navy-dark)}
  .tab[aria-selected="true"]{background:var(--panel);color:var(--navy);border-bottom-color:#ffc65c}

  .meta{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
        padding:6px 16px;font-size:12px;color:var(--muted);
        display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .meta b{color:var(--navy)}

  main{flex:1 1 auto;position:relative;background:var(--panel);min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f8f9fa}
  iframe[hidden]{display:none}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">{{SITE_TITLE}}</span>
    <span class="rel" id="relBadge"></span>
    <span class="spacer"></span>
    <label for="verSel">버전</label>
    <select id="verSel"></select>
    <a class="linkbtn" id="openNew" href="#" target="_blank" rel="noopener">새 창에서 열기</a>
  </div>
  <nav id="groups" class="group-tabs" role="tablist" aria-label="상위 항목"></nav>
</header>

<div class="subnav">
  <nav id="tabs" role="tablist" aria-label="표준 항목 세부 분류"></nav>
</div>

<div class="meta">
  <span>문서번호 <b id="mDocNo"></b></span>
  <span><b id="mTitle"></b></span>
  <span>문서 버전 <b id="mVer"></b></span>
  <span>최종 수정 <b id="mDate"></b></span>
  <span>작성자 <b id="mAuthor"></b></span>
  <span id="mNote"></span>
</div>

<main id="stage"><div class="loading" id="loading">문서를 불러오는 중…</div></main>

<script type="application/json" id="cfg">{{CONFIG_JSON}}</script>
{{EMBEDDED_DOCS}}
<script>
(function(){
  var CFG = JSON.parse(document.getElementById('cfg').textContent);
  var groupsEl = document.getElementById('groups');
  var tabsEl = document.getElementById('tabs');
  var stage  = document.getElementById('stage');
  var frames = {};
  var desiredInnerTabs = {};
  var activeGroupId = null;

  document.getElementById('relBadge').textContent =
    (CFG.self === 'latest' ? '최신 (' + CFG.release + ')' : CFG.self);

  // ----- version selector -----
  var sel = document.getElementById('verSel');
  CFG.versions.forEach(function(v){
    var o = document.createElement('option');
    o.value = v.href; o.textContent = v.label;
    if (v.current) o.selected = true;
    sel.appendChild(o);
  });
  if (CFG.versions.length < 2) sel.disabled = true;
  sel.addEventListener('change', function(){
    location.href = sel.value + (location.hash || '');
  });

  // ----- utf-8 base64 decode (bundle mode) -----
  function decodeB64(b64){
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function docById(id){
    for (var i=0;i<CFG.docs.length;i++) if (CFG.docs[i].id === id) return CFG.docs[i];
    return null;
  }

  function viewById(id){
    for (var i=0;i<CFG.groups.length;i++){
      var views = CFG.groups[i].views || [];
      for (var j=0;j<views.length;j++) if (views[j].id === id) return views[j];
    }
    return null;
  }

  function navItemById(id){
    var view = viewById(id);
    if (view) return view;
    var d = docById(id);
    return d ? {id:d.id, label:d.label, doc:d.id, inner_tab:''} : null;
  }

  function groupByNavId(id){
    for (var i=0;i<CFG.groups.length;i++){
      var group = CFG.groups[i];
      var views = group.views || [];
      for (var j=0;j<views.length;j++) if (views[j].id === id) return group;
      if (!views.length && group.docs.indexOf(id) !== -1) return group;
    }
    return null;
  }

  function groupItems(group){
    if (group.views && group.views.length) return group.views;
    return group.docs.map(function(id){
      var d = docById(id);
      return d ? {id:d.id, label:d.label, doc:d.id, inner_tab:''} : null;
    }).filter(Boolean);
  }

  function renderDocTabs(group){
    tabsEl.textContent = '';
    groupItems(group).forEach(function(item){
      var b = document.createElement('button');
      b.className='tab'; b.type='button'; b.role='tab';
      b.dataset.id = item.id; b.textContent = item.label;
      b.setAttribute('aria-selected','false');
      b.addEventListener('click', function(){ show(item.id, true); });
      tabsEl.appendChild(b);
    });
  }

  function selectGroup(group, showFirst){
    if (!group) return;
    activeGroupId = group.id;
    Array.prototype.forEach.call(groupsEl.children, function(b){
      b.setAttribute('aria-selected', String(b.dataset.id === group.id));
    });
    renderDocTabs(group);
    var items = groupItems(group);
    if (showFirst && items.length) show(items[0].id, true);
  }

  function sendInnerTab(docId){
    var f = frames[docId], innerTab = desiredInnerTabs[docId];
    if (!f || !innerTab) return;
    f.contentWindow.postMessage({type:'kbds-inner-tab', tab:innerTab}, '*');
  }

  function show(id, push){
    var item = navItemById(id); if (!item) return;
    var d = docById(item.doc); if (!d) return;

    var group = groupByNavId(id);
    if (group && activeGroupId !== group.id) selectGroup(group, false);

    Array.prototype.forEach.call(tabsEl.children, function(b){
      b.setAttribute('aria-selected', String(b.dataset.id === id));
    });
    document.getElementById('mDocNo').textContent  = d.document_no || '-';
    document.getElementById('mTitle').textContent  = d.label;
    document.getElementById('mVer').textContent    = d.version || '-';
    document.getElementById('mDate').textContent   = d.updated || '-';
    document.getElementById('mAuthor').textContent = d.author || '-';
    document.getElementById('mNote').textContent   = d.note || '';

    var open = document.getElementById('openNew');
    if (CFG.mode === 'site'){
      open.href = d.file + (item.inner_tab ? '#' + item.inner_tab : '');
      open.style.display='';
    }
    else { open.style.display = 'none'; }

    for (var k in frames) frames[k].hidden = (k !== d.id);
    desiredInnerTabs[d.id] = item.inner_tab || '';

    if (!frames[d.id]){
      var f = document.createElement('iframe');
      f.title = d.label;
      if (CFG.mode === 'site'){
        f.src = d.file;
      } else {
        var holder = document.getElementById('src-' + id);
        f.srcdoc = decodeB64(holder.textContent.trim());
      }
      f.addEventListener('load', function(){
        var l = document.getElementById('loading'); if (l) l.remove();
        sendInnerTab(d.id);
      });
      frames[d.id] = f;
      stage.appendChild(f);
    } else {
      sendInnerTab(d.id);
    }
    document.title = item.label + ' — ' + CFG.site_title;
    if (push && location.hash !== '#' + id) history.replaceState(null,'','#'+id);
  }

  CFG.groups.forEach(function(group){
    var b = document.createElement('button');
    b.className='group-tab'; b.type='button'; b.role='tab';
    b.dataset.id = group.id; b.textContent = group.label;
    b.setAttribute('aria-selected','false');
    b.addEventListener('click', function(){ selectGroup(group, true); });
    groupsEl.appendChild(b);
  });

  var start = (location.hash || '').replace('#','');
  var defaultId = navItemById(CFG.default_doc) ? CFG.default_doc : CFG.docs[0].id;
  show(navItemById(start) ? start : defaultId, true);
  window.addEventListener('hashchange', function(){
    var id = (location.hash||'').replace('#','');
    if (navItemById(id)) show(id, false);
  });
})();
</script>
</body>
</html>
